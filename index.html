  <!-- Ảnh và lời giới thiệu hiện ra khi chia sẻ link lên Facebook, Zalo, Messenger… (đổi tên miền nếu bạn tự đăng ở nơi khác) -->
  <meta property="og:type" content="website">

  <meta property="og:description" content="Tạo nhân vật mang tên mình, đeo ba lô đi học, vào lớp, lên bảng: luyện bảng cửu chương và học Toán, Khoa học, Tiếng Anh lớp 4 qua trò chơi. Miễn phí, không quảng cáo, chơi được trên điện thoại, máy tính bảng, máy tính.">

  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cửu chương">
  <script>
    // Trên tên miền thật luôn chuyển sang https (cần cho cài app, chơi offline và để tiến độ không bị tách làm hai nơi).
    // localhost, địa chỉ IP trong mạng nhà và địa chỉ có cổng riêng thì giữ nguyên.
    if (location.protocol === 'http:' && !location.port && !/^(localhost|[\d.]+|\[.*\]|.*\.local)$/.test(location.hostname)) {
      location.replace('https://' + location.host + location.pathname + location.search + location.hash);
    }
  </script>

  <link rel="stylesheet" href="css/style.css?v=12">

<body data-screen="title">
  <div id="app">
    <section id="s-title" class="screen title" aria-label="Cổng trường"></section>
    <section id="s-setup" class="screen setup-screen" hidden aria-label="Chuẩn bị đi học"></section>
    <section id="s-school" class="screen school" hidden aria-label="Sân trường">
      <header id="hud" class="hud"></header>
      <div id="map" class="map"></div>
      <nav id="quickbar" class="quickbar" aria-label="Đi nhanh tới các khu"></nav>
    </section>
    <section id="s-act" class="screen act" hidden aria-label="Hoạt động"></section>
    <section id="s-parent" class="screen act parent-screen" hidden aria-label="Góc dành cho ba mẹ"></section>
  </div>
  <div id="modal-root"></div>
  <!-- Nhắc xoay ngang: hiện khi điện thoại, máy tính bảng đang cầm dọc (xem css và initRotateWall trong app.js) -->
  <div id="rotate-wall" class="rotate-wall" role="dialog" aria-label="Xoay ngang màn hình để chơi">
    <div class="rotate-card">
      <svg class="rotate-ico" viewBox="0 0 120 90" aria-hidden="true"><rect x="8" y="14" width="40" height="66" rx="8" fill="none" stroke="#b8a1ff" stroke-width="5" stroke-dasharray="7 6"/><rect x="50" y="44" width="64" height="38" rx="8" fill="#7b61ff"/><rect x="57" y="50" width="50" height="26" rx="3" fill="#fff"/><path d="M40 8 Q78 2 88 30" fill="none" stroke="#ff8fab" stroke-width="5" stroke-linecap="round"/><path d="M78 26 L89 33 L95 21" fill="none" stroke="#ff8fab" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h2>Xoay ngang màn hình để chơi nhé!</h2>
      <p>Cầm ngang điện thoại hoặc máy tính bảng thì sân trường rộng hơn và dễ chơi hơn.</p>
      <button type="button" id="rotate-lock" class="btn primary big" hidden>Xoay ngang giúp con</button>
      <p class="muted small">Màn hình không tự xoay? Hãy tắt “Khoá xoay màn hình” trong bảng điều khiển nhanh của máy.</p>
      <button type="button" id="rotate-skip" class="btn ghost small">Cứ chơi dọc</button>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
